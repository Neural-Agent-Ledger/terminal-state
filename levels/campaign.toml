# TERMINAL STATE — the CAMPAIGN MANIFEST
#
# The authored order of the twelve story levels. This file — NOT the filename
# sort — is what `re_game::flow` uses to build the CAMPAIGN folder, to order it in
# level-select, and to gate it (level N+1 unlocks when level N is solved).
#
# It is EMBEDDED at compile time (`include_str!` in crates/re_game/src/flow.rs), so
# the shipped static binary carries the campaign with it and needs no runtime asset
# path. Editing this file therefore requires a rebuild — that is deliberate: the
# campaign order is code-level content, not a user setting.
#
# `id` is the level's STABLE progress key (its file stem — the same key
# `save::Progress` stores), so reordering the campaign never orphans a save.
#
# `movement` is the four-movement frame of docs/lore/PUZZLE_PROGRESSION_L1-L12.md §1:
#   P1  "First Sight"            L1–L3   sort true memory from script-projection
#   P2  "Splitting / the angle"  L4–L6   we ARE the gaze
#   P3  "The Phantom Sister"     L7–L9   a node that never answers
#   P4  "The Closing / Exit-Exit" L10–L12 the choice
# Wave 3 maps these tags to the audio director's movement themes; nothing else
# consumes them yet.
#
# `load` is the escalation contract's fog_far for this level (STORY_BIBLE §7:
# "fog_far shrinks, fog_color blackens, level to level — the world closes in as the
# system dies"). It is recorded here as the SINGLE SOURCE OF TRUTH for the curve and
# asserted monotone non-increasing by `flow::tests::campaign_fog_far_is_monotonic`.
#
# The pre-manifest numbered rooms `levels/01.lvl`..`08.lvl` are NOT deleted — they
# stay playable (and shard-bearing) under the ARCHIVE browse folder. The L-files are
# their story-true successors.

version = 1

