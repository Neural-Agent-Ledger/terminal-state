# PROVENANCE.toml — origin and licence of every content file in this repository.
#
# Scope: every file under levels/, assets/ and docs/lore/, plus the two other
# non-code data sets that ship inside the crate (code-wall text snapshots and
# test fixture levels). Source code under crates/ is covered by LICENSE
# (GPL-3.0-or-later) and is not listed file by file. The code-wall snapshots
# and test fixtures below are copies of terminal3d engine files and keep the
# engine's licence (`engine_licence`).
#
# Fields:
#   path     file path relative to the repository root
#   origin   "authored"  — written by TERMINAL STATE contributors for this project
#            "generated" — output of a program; `generator` names it
#            "derived"   — a copy or adaptation of another file; `from` names it
#            "third-party" — not ours; needs `source` and a committed licence file
#   licence  SPDX identifier
#   notes    anything a re-user needs to know
#
# A new file under levels/, assets/ or docs/lore/ needs an entry here in the
# same PR (see CONTRIBUTING.md, "Assets and provenance").
#
# At the time of writing there are no third-party files in this repository.

[defaults]
attribution = "TERMINAL STATE contributors"
content_licence = "CC-BY-SA-4.0"
code_licence = "GPL-3.0-or-later"
engine_licence = "MIT OR Apache-2.0"

